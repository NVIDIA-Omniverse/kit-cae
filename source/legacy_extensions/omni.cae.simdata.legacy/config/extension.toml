[package]
title = "CAE SimData Legacy Converters"
version = "1.0.1"
description = "Deprecated SimData converters for delegate-backed CaeDataSet and CaeFieldArray stages."
category = "CAE"
changelog = "docs/CHANGELOG.md"
keywords = ["kit", "cae", "simdata", "legacy"]
readme = "docs/README.md"
repository = "https://github.com/NVIDIA-Omniverse/kit-cae"

[dependencies]
"omni.cae.simdata" = {}
"omni.cae.core" = {}
"omni.cae.data" = {}

[[python.module]]
name = "omni.cae.simdata_legacy"

[[test]]
