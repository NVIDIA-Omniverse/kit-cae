[package]
title = "Omni CAE Core"
version = "1.1.1"
description = "Core CAE runtime utilities shared by active USD-plugin, SimData, and visualization extensions."
category = "internal"
changelog = "docs/CHANGELOG.md"
keywords = ["kit", "cae", "core", "extension"]
readme = "docs/README.md"
repository = "https://github.com/NVIDIA-Omniverse/kit-cae"

[dependencies]
"omni.cae.schema" = {}
"omni.kit.commands" = {}
"omni.usd" = {}
"omni.usd.core" = {}
"omni.usd.libs" = {}
"omni.warp.core" = {}
"usdrt.scenegraph" = {}
"omni.kit.pip_archive" = {}

[settings]
# Cache mode: controls when derived CAE data is cached.
# Options: "disabled" (no caching), "always" (cache all fields), "static-fields" (cache only non-time-varying fields)
persistent.exts."omni.cae.core".cacheMode = "always"

[[python.module]]
name = "omni.cae.core"

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]

[[test]]
dependencies = [
    "omni.cae.testing",
    "omni.cae.usd_plugins",
]
